schema_version = 3
id = "org.rackforge.rf-106"
name = "RF-106"
short_name = "RF-106"
vendor = "RackForge Community"
version = "0.2.13"
kind = "instrument"
state_version = 2
capabilities = [
    "audio_output",
    "midi_input",
    "presets",
    "state",
    "sample_accurate_automation",
]
ui_layouts = ["little@1"]
config_mode = true

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

[[resources]]
id = "program-bank"
name = "JUNO-106 SysEx Program Bank"
kind = "file"
required = false
data_path = "programs/import.syx"

[api]
major = 1
minor = 9

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#3B393A"
accent_color = "#E73020"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
